<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- App-like: the page itself never zooms; only the picture does -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>🎨 Adijan's Coloring Book</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      body {
        font-family: 'Nunito', system-ui, sans-serif;
        background: #0d0f1a;
        color: #e8eaf0;
        overscroll-behavior: none;
        /* Feel like a native app inside a WebView */
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
        user-select: none;
        -webkit-user-select: none;
      }
      input, textarea { user-select: auto; -webkit-user-select: auto; }
      /* No double-tap zoom delay on buttons */
      button, label, a, input { touch-action: manipulation; }
      img { -webkit-user-drag: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
