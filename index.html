<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- App-like: the page itself never zooms; only the picture does -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>🎨 Adijan's Coloring Book</title>
    <meta name="theme-color" content="#8ecdf7" />
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; }
      :root {
        --ink: #3b2a5a;        /* cartoon outline color */
        --sun: #ffe066;        /* "selected" yellow */
        --sky-top: #8ecdf7;
        --sky-bottom: #fde2f3;
        --panel: #fff7e8;
        --panel-edge: #f7c873;
      }
      body {
        font-family: 'Fredoka', 'Nunito', system-ui, sans-serif;
        background: linear-gradient(180deg, var(--sky-top) 0%, var(--sky-bottom) 100%) fixed;
        color: var(--ink);
        overscroll-behavior: none;
        /* Feel like a native app inside a WebView */
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
        -webkit-text-size-adjust: 100%;
        user-select: none;
        -webkit-user-select: none;
      }
      input, textarea { user-select: auto; -webkit-user-select: auto; }
      /* No double-tap zoom delay on buttons */
      button, label, a, input { touch-action: manipulation; }
      img { -webkit-user-drag: none; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
